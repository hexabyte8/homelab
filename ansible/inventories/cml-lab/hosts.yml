---
# CML basic-lab devices. The addresses live on the lab's 10.96.0.0/24 network
# and are reached over Tailscale through the tsgw1 subnet router (see
# opentofu/cml/basic-lab.tf and docs/cml-lab.md).
all:
  children:
    cml_lab:
      children:
        cml_routers:
          hosts:
            vrouter1:
              ansible_host: 10.96.0.1
        cml_switches:
          hosts:
            vswitch1:
              ansible_host: 10.96.0.2
