name: Copilot Setup Steps

# Automatically validate the setup on change, and allow manual runs via the
# Actions tab. This workflow must live at this path and contain a single
# `copilot-setup-steps` job for Copilot cloud agent to pick it up.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps` or Copilot will not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Copilot cloud agent only exposes secrets/variables from the `copilot`
    # GitHub Actions environment. Repo-level secrets are NOT available here.
    # Add BW_ACCESS_TOKEN under: Settings → Environments → copilot → Secrets.
    environment: copilot
    permissions:
      contents: read

    steps:
      - name: Validate copilot environment secret
        env:
          BW_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          if [ -z "${BW_ACCESS_TOKEN}" ]; then
            echo "::error::Missing required secret BW_ACCESS_TOKEN in the 'copilot' environment."
            echo "::error::Go to Settings -> Environments -> copilot -> Secrets and add BW_ACCESS_TOKEN."
            exit 1
          fi

      - name: Load secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            2ea22c80-a3b2-4b71-a5f7-b40f00c90b84 > TAILSCALE_OAUTH_CLIENT_ID
            9edcc17b-513b-4b4b-848b-b40f00c91c35 > TAILSCALE_OAUTH_CLIENT_SECRET

      - name: Validate Bitwarden secret mapping
        run: |
          if [ -z "${TAILSCALE_OAUTH_CLIENT_ID}" ]; then
            echo "::error::TAILSCALE_OAUTH_CLIENT_ID was not loaded from Bitwarden."
            exit 1
          fi
          if [ -z "${TAILSCALE_OAUTH_CLIENT_SECRET}" ]; then
            echo "::error::TAILSCALE_OAUTH_CLIENT_SECRET was not loaded from Bitwarden."
            exit 1
          fi

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:copilot
          version: 1.68.1

      - name: Enable MagicDNS
        run: sudo tailscale set --accept-dns=true | cat

      - name: Wait for DNS to be available
        run: |
          echo "Waiting for Tailscale DNS to be ready..."
          sleep 10
