name: OpenTofu CML State Fix (one-off)

# Temporary helper to drop stale cml2_node/cml2_link resources from state after
# they were deleted outside of IaC (directly on the CML controller), while the
# lab itself still exists. Safe to delete this workflow once used.

on:
  workflow_dispatch: {}

jobs:
  state-rm:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            efb9a246-29d5-423e-98c4-b40f00cc81a6 > AWS_ACCESS_KEY_ID
            735bb5f9-8a0e-427d-9f55-b40f00cc9c43 > AWS_SECRET_ACCESS_KEY
            b6808950-6a75-4cb7-8ce6-b4d4017a66c8 > CML_CLOUD_USER
            8ccae743-5f9e-4bf2-aef0-b4d4017a53be > CML_CLOUD_PASS
            52c553fc-84b8-41a5-99c5-b4d4017a7568 > CML_CLOUD_URL

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init -no-color
        working-directory: ./opentofu/cml
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Show current state
        run: tofu state list
        working-directory: ./opentofu/cml
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Remove stale node/link resources from state
        run: |
          set -x
          # cml2_lab.basic-lab is intentionally NOT removed: it still exists on
          # the controller. Only the nodes/links inside it were deleted
          # out-of-band, so drop just those from state.
          for addr in \
            cml2_node.external_connector1 \
            cml2_node.node1 \
            cml2_node.node2 \
            cml2_node.vswitch1 \
            cml2_node.vrouter1 \
            cml2_link.link1 \
            cml2_link.link2 \
            cml2_link.link3 \
            cml2_link.link4 \
          ; do
            tofu state rm "$addr" || echo "::warning::$addr not present in state, skipping"
          done
        working-directory: ./opentofu/cml
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Show resulting state
        run: tofu state list
        working-directory: ./opentofu/cml
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
