name: k3s - Patch Cluster Secrets

# Bootstraps the `bw-auth-token` k8s Secret in every namespace that uses the
# Bitwarden Secrets Manager operator, and handles the remaining secrets that
# are NOT managed by the operator (minecraft, mcp-proxmox).
#
# Most cluster secrets are now managed automatically by the sm-operator via
# BitwardenSecret CRDs — this workflow only needs to run:
#   1. After a fresh disaster-recovery rebuild (to seed bw-auth-token)
#   2. When rotating the BWS machine account token
#   3. When updating minecraft / mcp-proxmox secrets
#
# The `bw-auth-token` bootstrap is idempotent: it uses `kubectl apply` so
# it creates or updates the Secret in each operator-using namespace.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which secret(s) to patch'
        required: true
        type: choice
        default: all
        options:
          - all
          - bw-auth-token          # Bootstrap the sm-operator token in all namespaces
          - cert-manager-letsencrypt-email
          - minecraft-rcon-password
          - mcp-proxmox-secrets
      target_host:
        description: 'k3s server hostname (used to fetch kubeconfig)'
        required: true
        type: string
        default: 'k3s-server'

jobs:
  patch-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            d2853bd9-e658-4206-a9d4-b43a0186a46a > ADMIN_EMAIL
            68a5f06c-2b1f-4308-ba6b-b49b01722993   > BWS_K8S_OPERATOR_TOKEN
            9a5a848c-a0d3-494c-9a38-b40f00c7c7cb > PM_API_TOKEN_ID
            5604d469-60fd-49fe-978e-b40f00c813d0 > PM_API_TOKEN_SECRET
            4c9aa2a6-aa46-4fed-bac8-b43a00e06fd8 > PROXMOX_HOST
            2ea22c80-a3b2-4b71-a5f7-b40f00c90b84 > TAILSCALE_OAUTH_CLIENT_ID
            9edcc17b-513b-4b4b-848b-b40f00c91c35 > TAILSCALE_OAUTH_CLIENT_SECRET
            e2f18624-762c-4818-a929-b448013205f9 > MINECRAFT_RCON_PASSWORD
            793deec1-de4b-487b-b685-b43a00e06099 > AUTHENTIK_SMTP_PASSWORD
      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: 1.68.1

      - name: Enable MagicDNS
        run: sudo tailscale set --accept-dns=true | cat

      - name: Wait for DNS to be available
        run: sleep 10

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan ${{ inputs.target_host }}.daggertooth-scala.ts.net >> ~/.ssh/known_hosts 2>/dev/null

      - name: Get kubeconfig from k3s server
        id: get-kubeconfig
        run: |
          set -o pipefail
          mkdir -p ~/.kube && chmod 700 ~/.kube
          ssh ubuntu@${{ inputs.target_host }}.daggertooth-scala.ts.net \
            "sudo cat /etc/rancher/k3s/k3s.yaml" \
            | sed 's|server: https://127\.0\.0\.1:6443|server: https://${{ inputs.target_host }}:6443|' \
            > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Bootstrap bw-auth-token in all operator-using namespaces
        # Creates (or updates) the bw-auth-token Secret in every namespace that
        # has BitwardenSecret resources. The sm-operator reads this token to
        # authenticate to BWS and sync secrets automatically.
        #
        # One-time setup: create a BWS Machine Account Access Token in
        # sm.bitwarden.com → Machine Accounts → Access Tokens, store it as a
        # new BWS secret, and replace FILL_IN_BWS_K8S_OPERATOR_TOKEN_UUID above.
        if: inputs.target == 'all' || inputs.target == 'bw-auth-token'
        env:
          OPERATOR_TOKEN: ${{ env.BWS_K8S_OPERATOR_TOKEN }}
        run: |
          for ns in actual actual-mcp actual-mcp-secondary authentik cert-manager cloudflared forgejo jellyfin mealie monitoring stalwart tailscale velero; do
            if kubectl get namespace "$ns" >/dev/null 2>&1; then
              jq -nc \
                --arg ns "$ns" \
                --arg token "$OPERATOR_TOKEN" \
                '{
                  apiVersion: "v1",
                  kind: "Secret",
                  metadata: {name: "bw-auth-token", namespace: $ns},
                  stringData: {token: $token}
                }' | kubectl apply -f -
              echo "[OK] bw-auth-token created/updated in namespace $ns"
            else
              echo "::warning::Namespace $ns does not exist yet — skipping bw-auth-token bootstrap"
            fi
          done

      - name: Patch mcp-proxmox/mcp-proxmox-secrets
        if: inputs.target == 'all' || inputs.target == 'mcp-proxmox-secrets'
        env:
          PM_TOKEN_ID: ${{ env.PM_API_TOKEN_ID }}
          PM_TOKEN_SECRET: ${{ env.PM_API_TOKEN_SECRET }}
          PM_HOST: ${{ env.PROXMOX_HOST }}
        run: |
          PM_USER="${PM_TOKEN_ID%%!*}"
          PM_TOKEN_NAME="${PM_TOKEN_ID##*!}"
          CONFIG_JSON=$(jq -nc \
            --arg host "$PM_HOST" \
            --arg user "$PM_USER" \
            --arg name "$PM_TOKEN_NAME" \
            --arg value "$PM_TOKEN_SECRET" \
            '{
              proxmox: {host: $host, port: 8006, verify_ssl: false, service: "PVE"},
              auth: {user: $user, token_name: $name, token_value: $value},
              logging: {level: "INFO", format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"},
              mcp: {host: "0.0.0.0", port: 8811, transport: "STREAMABLE"},
              security: {dev_mode: true},
              jobs: {sqlite_path: "/tmp/proxmox-jobs.sqlite3"}
            }')
          if kubectl get secret mcp-proxmox-secrets -n mcp-proxmox >/dev/null 2>&1; then
            kubectl patch secret mcp-proxmox-secrets -n mcp-proxmox --type=merge -p "$(jq -nc \
              --arg cfg "$CONFIG_JSON" '{stringData: {"config.json": $cfg}}')"
          else
            echo "::warning::Skipping patch for mcp-proxmox/mcp-proxmox-secrets — secret does not exist yet"
          fi

      - name: Patch minecraft/minecraft-secrets
        if: inputs.target == 'all' || inputs.target == 'minecraft-rcon-password'
        env:
          RCON_PASSWORD: ${{ env.MINECRAFT_RCON_PASSWORD }}
        run: |
          if kubectl get secret minecraft-secrets -n minecraft >/dev/null 2>&1; then
            kubectl patch secret minecraft-secrets -n minecraft --type=merge -p "$(jq -nc \
              --arg pw "$RCON_PASSWORD" '{stringData: {RCON_PASSWORD: $pw}}')"
          else
            echo "::warning::Skipping patch for minecraft/minecraft-secrets — secret does not exist yet"
          fi

      - name: Patch cert-manager/letsencrypt-production email
        if: inputs.target == 'all' || inputs.target == 'cert-manager-letsencrypt-email'
        env:
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
        run: |
          if kubectl get clusterissuer letsencrypt-production >/dev/null 2>&1; then
            kubectl patch clusterissuer letsencrypt-production --type=merge -p "$(jq -nc --arg e "$ADMIN_EMAIL" '{spec: {acme: {email: $e}}}')"
          else
            echo "::warning::Skipping patch for cert-manager/letsencrypt-production — ClusterIssuer does not exist yet"
          fi
