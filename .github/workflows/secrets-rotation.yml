name: Weekly Secrets Rotation

# Generates new random values for rotatable secrets, writes them to BWS,
# then triggers an Authentik OpenTofu apply so the OAuth2 providers pick up
# the new client secrets. The sm-operator syncs BWS → k8s within 5 minutes;
# Reloader then restarts any pods that reference the changed Secrets.
#
# Rotated secrets (BWS UUIDs):
#   cfa6860a  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET  (Grafana OAuth client secret)
#   1f5eb6e8  AUTHENTIK_ACTUAL_CLIENT_SECRET        (Actual Budget OpenID client secret)
#   c0f6acf5  GF_ADMIN_PASS                         (Grafana admin password)
#   6e047103  STALWART_ADMIN_PASSWORD               (Stalwart mail admin password)
#
# NOT rotated (externally-issued tokens that require manual renewal):
#   Tailscale OAuth, Cloudflare API token, Cloudflare tunnel token

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: read

jobs:
  rotate-secrets:
    name: Generate and write new secrets to BWS
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # Pass new OAuth secrets to the authentik-apply job so tofu can set them
      grafana_secret: ${{ steps.generate.outputs.grafana_secret }}
      actual_secret: ${{ steps.generate.outputs.actual_secret }}

    steps:
      - name: Install bws CLI
        run: |
          curl -sSLo /tmp/bws.zip \
            "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/bws.zip" | sha256sum -c -
          unzip -q /tmp/bws.zip bws -d /tmp
          chmod +x /tmp/bws
          sudo mv /tmp/bws /usr/local/bin/bws
          bws --version

      - name: Generate new secret values
        id: generate
        run: |
          # Generate cryptographically random 40-char hex secrets
          GRAFANA_SECRET=$(openssl rand -hex 40)
          ACTUAL_SECRET=$(openssl rand -hex 40)
          GRAFANA_ADMIN_PASS=$(openssl rand -base64 32)
          STALWART_ADMIN_PASS=$(openssl rand -base64 32)

          # Mask all values in logs
          echo "::add-mask::$GRAFANA_SECRET"
          echo "::add-mask::$ACTUAL_SECRET"
          echo "::add-mask::$GRAFANA_ADMIN_PASS"
          echo "::add-mask::$STALWART_ADMIN_PASS"

          # Store for subsequent steps and jobs
          echo "grafana_secret=$GRAFANA_SECRET" >> $GITHUB_OUTPUT
          echo "actual_secret=$ACTUAL_SECRET" >> $GITHUB_OUTPUT
          {
            echo "GRAFANA_SECRET=$GRAFANA_SECRET"
            echo "ACTUAL_SECRET=$ACTUAL_SECRET"
            echo "GRAFANA_ADMIN_PASS=$GRAFANA_ADMIN_PASS"
            echo "STALWART_ADMIN_PASS=$STALWART_ADMIN_PASS"
          } >> $GITHUB_ENV

      - name: Write rotated secrets to BWS
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          # OAuth client secrets (will be pushed into Authentik via tofu apply)
          bws secret edit cfa6860a-116e-4893-9b23-b48e0176f8cd --value "$GRAFANA_SECRET"
          echo "[OK] GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET rotated"

          bws secret edit 1f5eb6e8-6c44-4cec-9a9d-b49b0173d913 --value "$ACTUAL_SECRET"
          echo "[OK] AUTHENTIK_ACTUAL_CLIENT_SECRET rotated"

          # Admin passwords (sm-operator + Reloader handle the rest — no tofu needed)
          bws secret edit c0f6acf5-ac9e-4f36-af05-b49b0174d685 --value "$GRAFANA_ADMIN_PASS"
          echo "[OK] GF_ADMIN_PASS rotated"

          bws secret edit 6e047103-0d0d-40ff-8255-b43a00e06e68 --value "$STALWART_ADMIN_PASS"
          echo "[OK] STALWART_ADMIN_PASSWORD rotated"

          echo "All secrets written — sm-operator will sync to k8s within 5 minutes."

  # Re-apply Authentik stack so both OAuth2 providers get the new client_secret.
  # The reusable workflow reads GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET and
  # ACTUAL_OPENID_CLIENT_SECRET from BWS (already updated above) and passes
  # them as TF_VAR_grafana_client_secret / TF_VAR_actual_client_secret.
  apply-authentik:
    name: Apply Authentik OpenTofu (sync new OAuth secrets)
    needs: rotate-secrets
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/opentofu-reusable.yml
    with:
      stack: authentik
      action: apply
    secrets:
      BW_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
