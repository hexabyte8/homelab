# BitwardenSecret — opencode-secret
#
# One-time setup — create the following entry in BWS (sm.bitwarden.com), then
# replace the placeholder UUID below:
#
#   OPENCODE_SERVER_PASSWORD  value: (a strong password for the web interface)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: opencode-secret
  namespace: opencode
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: opencode-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME_OPENCODE_SERVER_PASSWORD_UUID"
      secretKeyName: OPENCODE_SERVER_PASSWORD
