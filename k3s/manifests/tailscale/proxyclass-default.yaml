apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: prod
spec:
  statefulSet:
    pod:
      # NOTE: previously pinned away from k3s-agent-1 to spread proxies across
      # two workers. With the single-worker consolidation (k3s-agent-2
      # removed), k3s-agent-1 is the only schedulable worker node, so this
      # anti-affinity is removed to avoid permanently Pending proxy pods.
      tailscaleInitContainer:
        env:
          - name: TS_EXTRA_ARGS
            value: "--advertise-tags=tag:k8s-operator"
      tailscaleContainer:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
