# BitwardenSecret — operator-oauth (Tailscale)
# The sm-operator syncs these BWS secrets into the `operator-oauth` k8s Secret
# used by the Tailscale Kubernetes operator.
#
# BWS secret UUIDs used:
#   2ea22c80-a3b2-4b71-a5f7-b40f00c90b84  TAILSCALE_OAUTH_CLIENT_ID     → client_id
#   9edcc17b-513b-4b4b-848b-b40f00c91c35  TAILSCALE_OAUTH_CLIENT_SECRET → client_secret
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: operator-oauth
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "2ea22c80-a3b2-4b71-a5f7-b40f00c90b84"
      secretKeyName: client_id
    - bwSecretId: "9edcc17b-513b-4b4b-848b-b40f00c91c35"
      secretKeyName: client_secret
