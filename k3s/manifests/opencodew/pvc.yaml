apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencodew-data
  namespace: opencodew
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencodew-workspace
  namespace: opencodew
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
