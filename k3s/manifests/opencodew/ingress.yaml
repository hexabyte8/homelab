apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencodew
  namespace: opencodew
  annotations:
    tailscale.com/proxy-class: "prod"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencodew
                port:
                  number: 4096
  tls:
    - hosts:
        - opencodew
