apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar
  namespace: radar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radar
rules:
  # Read-only operational view of the cluster for interactive tooling.
  #
  # Core (v1) resources are enumerated explicitly so that Secret objects are
  # NOT readable through this identity — credential values should be retrieved
  # through the secret manager or an admin workstation instead. Everything
  # else the resource browser needs (pods, logs, deployments, events, CRDs)
  # continues to work unchanged.
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - pods
      - pods/attach
      - pods/binding
      - pods/eviction
      - pods/log
      - pods/portforward
      - pods/proxy
      - pods/status
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]
  # Namespaced built-in API groups. None of these carry credential material,
  # so a resource wildcard is safe here.
  - apiGroups:
      - apps
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - authentication.k8s.io
      - authorization.k8s.io
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - snapshot.storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # API groups installed by the charts/operators running in this cluster.
  # BitwardenSecret CRs reference secret values by ID only — values stay in
  # the secret manager and are not exposed on the CR.
  - apiGroups:
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - image-reflector.toolkit.fluxcd.io
      - k8s.bitwarden.com
      - cert-manager.io
      - acme.cert-manager.io
      - monitoring.coreos.com
      - longhorn.io
      - metallb.io
      - metrics.k8s.io
      - postgresql.cnpg.io
      - traefik.io
      - tailscale.com
      - cilium.io
      - k8s.cni.cncf.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Discovery/health endpoints.
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: radar
subjects:
  - kind: ServiceAccount
    name: radar
    namespace: radar