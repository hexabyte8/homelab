apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar
  namespace: radar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radar
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: radar
subjects:
  - kind: ServiceAccount
    name: radar
    namespace: radar
