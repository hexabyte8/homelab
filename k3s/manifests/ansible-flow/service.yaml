apiVersion: v1
kind: Service
metadata:
  name: ansible-flow-backend
  namespace: ansible-flow
spec:
  type: ClusterIP
  selector:
    app: ansible-flow-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ansible-flow
  namespace: ansible-flow
spec:
  type: ClusterIP
  selector:
    app: ansible-flow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
