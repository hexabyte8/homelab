# BitwardenSecret — mealie-secret
#
# Mealie uses a SECRET_KEY for signing sessions/tokens.
#
# One-time setup — create the following entries in BWS (sm.bitwarden.com),
# then replace the placeholder UUIDs below with the real ones:
#
#   SECRET_KEY   value: (generate with: openssl rand -hex 32)
#
# BWS secret UUIDs:
#   2cbe0ca6-690f-41fd-bfb7-b4b10011bf1d  SECRET_KEY
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: mealie-secret
  namespace: mealie
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: mealie-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "2cbe0ca6-690f-41fd-bfb7-b4b10011bf1d"
      secretKeyName: SECRET_KEY
---
# BitwardenSecret — mealie-oidc-secret
# The sm-operator syncs these BWS secrets into the `mealie-oidc-secret`
# k8s Secret, which the Mealie deployment reads as env vars for OIDC
# authentication via Authentik.
#
# One-time setup — create these 2 entries in BWS (sm.bitwarden.com), then
# replace the REPLACE_ME UUIDs below with the real ones:
#
#   OIDC_CLIENT_ID      value: mealie  (written by tofu CI after first apply)
#   OIDC_CLIENT_SECRET  value: (written by tofu CI after first apply, rotated weekly)
#
# After creating the BWS entries, also replace REPLACE_ME_MEALIE_OIDC_CLIENT_ID_UUID
# and REPLACE_ME_MEALIE_OIDC_CLIENT_SECRET_UUID in:
#   .github/workflows/opentofu-reusable.yml  (load secrets + BWS sync steps)
#   .github/workflows/secrets-rotation.yml   (rotate-secrets job)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: mealie-oidc-secret
  namespace: mealie
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: mealie-oidc-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME_MEALIE_OIDC_CLIENT_ID_UUID"
      secretKeyName: OIDC_CLIENT_ID
    - bwSecretId: "REPLACE_ME_MEALIE_OIDC_CLIENT_SECRET_UUID"
      secretKeyName: OIDC_CLIENT_SECRET
