apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: forgejo
data:
  # Server
  GITEA__server__DOMAIN: "git.chronobyte.net"
  GITEA__server__ROOT_URL: "https://git.chronobyte.net/"
  GITEA__server__HTTP_PORT: "3000"
  # SSH — use Forgejo's built-in SSH server (no OpenSSH daemon in the image).
  # SSH_LISTEN_PORT is the port the server binds to inside the container
  # (unprivileged, since the process runs as uid 1000). SSH_PORT/SSH_DOMAIN
  # are what's advertised in clone URLs, and point at the Tailscale-exposed
  # LoadBalancer service (see service-ssh-tailscale.yaml) so users clone over
  # the tailnet rather than the public Cloudflare tunnel.
  GITEA__server__DISABLE_SSH: "false"
  GITEA__server__START_SSH_SERVER: "true"
  GITEA__server__SSH_LISTEN_PORT: "2222"
  GITEA__server__SSH_PORT: "22"
  GITEA__server__SSH_DOMAIN: "git-ssh.daggertooth-scala.ts.net"
  # Security — INSTALL_LOCK prevents the setup wizard from appearing after first run
  GITEA__security__INSTALL_LOCK: "true"
  # Service — disable self-registration; all users must authenticate via Authentik
  GITEA__service__DISABLE_REGISTRATION: "true"
  GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
  GITEA__service__ENABLE_INTERNAL_SIGNIN: "false"
  GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
  GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
  # OAuth2 client — create/link accounts from Authentik OIDC identities
  GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
  GITEA__oauth2_client__ACCOUNT_LINKING: "auto"
  # Database — SQLite, stored on the persistent volume.
  # Forgejo's image creates /data/gitea/ by default; using that path avoids
  # the need for an init container to pre-create the directory.
  GITEA__database__DB_TYPE: "sqlite3"
  GITEA__database__PATH: "/data/gitea/gitea.db"
  # Logging
  GITEA__log__MODE: "console"
  GITEA__log__LEVEL: "info"
  # Mailer — relay through Stalwart
  GITEA__mailer__ENABLED: "true"
  GITEA__mailer__SMTP_ADDR: "stalwart.stalwart.svc.cluster.local"
  GITEA__mailer__SMTP_PORT: "587"
  GITEA__mailer__FROM: "forgejo <noreply@chronobyte.net>"
  # Actions — enable Forgejo Actions and resolve third-party actions (e.g.
  # bitwarden/sm-action, tailscale/github-action) directly from GitHub.
  # This means only BW_ACCESS_TOKEN needs to be stored as a Forgejo secret;
  # all other secrets are loaded at runtime via bitwarden/sm-action, exactly
  # as the equivalent GitHub Actions workflows do.
  GITEA__actions__ENABLED: "true"
  GITEA__actions__DEFAULT_ACTIONS_URL: "https://github.com"
