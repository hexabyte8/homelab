# BitwardenSecret — forgejo-oidc-secret
# The sm-operator syncs these BWS secrets into the `forgejo-oidc-secret`
# k8s Secret, which the Forgejo deployment reads as env vars. The postStart
# lifecycle hook uses FORGEJO_OIDC_CLIENT_ID and FORGEJO_OIDC_CLIENT_SECRET to
# register Authentik as an OAuth2 auth source via `forgejo admin auth add-oauth`.
#
# One-time setup — create these 2 entries in BWS (sm.bitwarden.com), then
# replace the REPLACE_ME UUIDs below with the real ones:
#
#   FORGEJO_OIDC_CLIENT_ID      value: forgejo  (written by tofu CI after first apply)
#   FORGEJO_OIDC_CLIENT_SECRET  value: (written by tofu CI after first apply, rotated weekly)
#
# After creating the BWS entries, also replace REPLACE_ME_FORGEJO_OIDC_CLIENT_ID_UUID
# and REPLACE_ME_FORGEJO_OIDC_CLIENT_SECRET_UUID in:
#   .github/workflows/opentofu-reusable.yml  (load secrets + BWS sync steps)
#   .github/workflows/secrets-rotation.yml   (rotate-secrets job)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: forgejo-oidc-secret
  namespace: forgejo
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: forgejo-oidc-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "ab243288-4bd3-4e3e-bdbd-b4b800f0fef4"
      secretKeyName: FORGEJO_OIDC_CLIENT_ID
    - bwSecretId: "1390f895-1b91-4882-a5f9-b4b800f14c7e"
      secretKeyName: FORGEJO_OIDC_CLIENT_SECRET
