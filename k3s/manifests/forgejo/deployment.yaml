apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: forgejo
      annotations:
        # Reloader: restart pod when the OIDC secret is rotated so the
        # postStart hook re-registers the OAuth2 source with the new credentials.
        secret.reloader.stakater.com/reload: "forgejo-oidc-secret"
        configmap.reloader.stakater.com/reload: "forgejo-config"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          # Forgejo runs as uid/gid 1000 (git). The PVC may have directories
          # owned by root from prior runs (e.g. /data/git/.ssh), which causes
          # "permission denied" when Forgejo tries to write authorized_keys.tmp.
          command:
            - sh
            - -c
            - |
              mkdir -p /data/git/.ssh /data/gitea
              chown -R 1000:1000 /data/git /data/gitea
              chmod 700 /data/git/.ssh
          securityContext:
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:10
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: forgejo-config
            - secretRef:
                name: forgejo-oidc-secret
          volumeMounts:
            - name: data
              mountPath: /data
          # postStart registers Authentik as the OIDC auth source on first boot and
          # updates it on every subsequent pod restart (e.g. after secret rotation),
          # ensuring credentials are always current. The loop is bounded to 5 minutes.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -eu
                    FORGEJO_CLI="/usr/local/bin/gitea --config /data/gitea/conf/app.ini --work-path /data/gitea"
                    i=0
                    until ${FORGEJO_CLI} admin auth list --vertical-bars >/tmp/forgejo-auth-sources 2>/tmp/forgejo-auth-list.err; do
                      i=$((i+1))
                      [ "$i" -ge 60 ] && echo "ERROR: Forgejo auth CLI did not become ready in time; aborting startup" && cat /tmp/forgejo-auth-list.err && exit 1
                      sleep 5
                    done
                    AUTHENTIK_AUTH_ID="$(awk -F'|' '$2 ~ /^[[:space:]]*Authentik[[:space:]]*$/ {gsub(/[[:space:]]/, "", $1); print $1; exit}' /tmp/forgejo-auth-sources)"
                    if [ -n "${AUTHENTIK_AUTH_ID}" ]; then
                      ${FORGEJO_CLI} admin auth update-oauth \
                        --id "${AUTHENTIK_AUTH_ID}" \
                        --name "Authentik" \
                        --provider openidConnect \
                        --key "${FORGEJO_OIDC_CLIENT_ID}" \
                        --secret "${FORGEJO_OIDC_CLIENT_SECRET}" \
                        --auto-discover-url "https://authentik.chronobyte.net/application/o/forgejo/.well-known/openid-configuration" \
                        --scopes "openid email profile"
                    else
                      ${FORGEJO_CLI} admin auth add-oauth \
                        --name "Authentik" \
                        --provider openidConnect \
                        --key "${FORGEJO_OIDC_CLIENT_ID}" \
                        --secret "${FORGEJO_OIDC_CLIENT_SECRET}" \
                        --auto-discover-url "https://authentik.chronobyte.net/application/o/forgejo/.well-known/openid-configuration" \
                        --scopes "openid email profile"
                    fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            # s6-overlay starts as root and uses su-exec to drop to uid/gid
            # 1000 (git user). It needs CHOWN + FOWNER to fix up ownership and
            # permissions on /app and /data, and SETUID + SETGID + DAC_OVERRIDE
            # for su-exec / setgroups(). Dropping ALL without adding these back
            # causes the container to crash before Forgejo can start.
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - SETUID
                - SETGID
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
