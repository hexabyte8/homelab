# BitwardenSecret — gitea-oidc-secret
# The sm-operator syncs these BWS secrets into the `gitea-oidc-secret`
# k8s Secret, which the Gitea deployment reads as env vars. The postStart
# lifecycle hook uses GITEA_OIDC_CLIENT_ID and GITEA_OIDC_CLIENT_SECRET to
# register Authentik as an OAuth2 auth source via `gitea admin auth add-oauth`.
#
# One-time setup — create these 2 entries in BWS (sm.bitwarden.com), then
# replace the REPLACE_ME UUIDs below with the real ones:
#
#   GITEA_OIDC_CLIENT_ID      value: gitea  (written by tofu CI after first apply)
#   GITEA_OIDC_CLIENT_SECRET  value: (written by tofu CI after first apply, rotated weekly)
#
# After creating the BWS entries, also replace REPLACE_ME_GITEA_OIDC_CLIENT_ID_UUID
# and REPLACE_ME_GITEA_OIDC_CLIENT_SECRET_UUID in:
#   .github/workflows/opentofu-reusable.yml  (load secrets + BWS sync steps)
#   .github/workflows/secrets-rotation.yml   (rotate-secrets job)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: gitea-oidc-secret
  namespace: gitea
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: gitea-oidc-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME_GITEA_OIDC_CLIENT_ID_UUID"
      secretKeyName: GITEA_OIDC_CLIENT_ID
    - bwSecretId: "REPLACE_ME_GITEA_OIDC_CLIENT_SECRET_UUID"
      secretKeyName: GITEA_OIDC_CLIENT_SECRET
