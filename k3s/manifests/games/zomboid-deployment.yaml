apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomboid
  namespace: games
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zomboid
  template:
    metadata:
      labels:
        app: zomboid
    spec:
      automountServiceAccountToken: false
      containers:
        - name: zomboid
          image: danixu86/project-zomboid-dedicated-server:42.21-release-2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16261
              protocol: UDP
              name: game-udp
            - containerPort: 8766
              protocol: UDP
              name: steam1-udp
            - containerPort: 8767
              protocol: UDP
              name: steam2-udp
            # Build 42+ only needs the two game UDP ports; no more
            # per-player TCP client-slot range like older PZ builds.
            - containerPort: 16262
              protocol: UDP
              name: game-udp2
            - containerPort: 27015
              protocol: TCP
              name: rcon
          env:
            - name: ADMINUSERNAME
              value: "admin"
            - name: ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-credentials
                  key: ADMINPASSWORD
            - name: RCONPASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-credentials
                  # Same password as ADMINPASSWORD — the BWS mapping only
                  # synced one key (see zomboid-bw-secret.yaml comment).
                  key: ADMINPASSWORD
            - name: SERVERNAME
              value: "servertest"
            - name: DISPLAYNAME
              value: "Homelab Zomboid (migrated)"
            - name: PUBLIC
              value: "false"
            - name: SERVERPRESET
              value: "Apocalypse"
            # Migrated from a friend's server backup (2026-10-03).
            # Mods= -> MOD_IDS, WorkshopItems= -> WORKSHOP_IDS, taken
            # directly from their servertest.ini. 213 mod IDs / 177
