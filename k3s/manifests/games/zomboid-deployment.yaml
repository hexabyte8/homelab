            - name: MOD_IDS
              value: "PROJECTRVInterior42;MoodleFramework;MoodleFramework_SafetyPatch;damnlib;ImmersiveVehiclePaint;HBVCEFb42;SWMG;49powerWagon;62daimlerFerret;69charger;69fordMustang;69fordMustangExtra;70chevelle;70roadRunner;78amgeneralM35A2;78amgeneralM35A2extra;78amgeneralM49A2C;78amgeneralM50A3;78amgeneralM62;78lamboCountach;83gmcGseriesVans;83gmcVanduraATeam;85chevyStepVan;85chevyStepVanexpanded;86oshkoshP19A;90fordF350ambulance;90pierceArrow;91lexusLS400;92amgeneralM998;92amgeneralM998extra;93chevySuburban;93chevySuburbanExpanded;alicesWeaponSling;alicesWeaponSlingRadialMenu;AMGeneralTankerFunctionality;UnofficialMappersCommunityTilePack;BarricadesRebuilt;BarricadeTheDoor;BetterCorpseBurning;BetterFireExtinguishers;BlackPowderGunsmithing;BoteBR;CovoBR;CurlUp;CVI;CyesPushDoors;DashRoamerB42;FenceSheets;fhqMotoriousZone;fhqMotoriousZoneExotics;fhqMotoriousZoneImports;fhqMotoriousZoneRealNames;fhqMotoriousZoneUSDM;FrotaBRRVAddon;FurniturePushPull;GurneyTransport;HBAmmoCraft;HBTacReload;HeartHealthMeter;ItemArrange;ItemCondition_KingEJ;J93RunningBloodPools;JumboStumpsDoneRight;LGExtendedElectricity;NicksInventorySelectionFix;LGExtendedPlumbing;LGRealisticPowerUsage;LivestockPanelPlus;MaskaradsSummerCar;Mulch;MuzzleSmoke;NicksTurnOffFridges;OmennVanillaClearGlass;PalmPilots;PFHDTrueCargo;VanillaOutfitsExpanded;RadArchery;Railroader;RealVending;RVVFX;Shadowcopter;SkullysZombieCollision;StowInHands;SubirEscaleras;GunsOfMarz;ThisIsYourLife;ThisIsYourLifeControllerPatch;TrippingZombies;Tuna_GunRacks;Tuna_EquipmentRacks;WhennyagoInitiative;ZeroWeightKeys_B42;lgd_antibodies;ammomaker;VanillaFoodsExpanded;STA_PryOpen;SkillJournal;WanderingHordesCore;WanderingHordes;PlowAttachment;CarRoofFix;CarWeaponFix;CarEnterExitFix;GanydeBielovzki's Frockin Backstage!;GanydeBielovzki's Frockin Splendor! Vol.2;GanydeBielovzki's Frockin Splendor!;GanydeBielovzki's Frockin Splendor! Vol.3;GanydeBielovzki's Frockin Shirts n Ties;GanydeBielovzki's Frockin Splendor! Vol.4;GanydeBielovzki's Frockin Wiseguys;GanydeBielovzki's Frockin Splendor! Vol.5;GanydeBielovzki's Frockin Stompers!;GanydeBielovzki's Frockin Splendor! Vol.6;AP;91range;67commando;82oshkoshM911;59meteor;ECTO1;84merc;83amgeneralM923;83amgeneralM923extra;92nissanGTR;86fordE150;86fordE150dnd;86fordE150expanded;86fordE150mm;86fordE150pd;70dodge;82jeepJ10;82jeepJ10t;88chevyS10;89fordBronco;70barracuda;93townCar;89trooper;69mini;69mini_ItalianJob;69mini_MrBean;69mini_PitbullSpecial;92fordCVPI;93fordElgin;69camaro;93mustangSSP;63beetle;91geoMetro;67gt500;89dodgeCaravan;63Type2Van;87toyotaMR2;93fordF350;93fordTaurus;87fordB700;90bmwE30;76chevyKseries;76chevyKseriesExpanded;84gageV300;87chevySuburban;75grandPrix;87buickRegal;80manKat1;81deloreanDMC12;81deloreanDMC12BTTF;68firebird;92jeepYJ;92jeepYJJP18;89volvo200;82firebird;82firebirdKITT;KI5trailers;77firebird;91fordLTD;82porsche911;84jeepXJ;85chevyCaprice;85pontiacParisienne;85buickLeSabre;85oldsmobileDelta88;86chevyCUCV;88toyotaHilux;66pontiacLeMans;73fordFalcon;73fordFalconPS;91nissan240sx;91fordRanger;65banshee;89defender;84cadillacDeVille;84buickElectra;84oldsmobile98;70fordEscort;KI5campers;84corvette;79camaro;76chryslerNewYorker;73nissanGTR;87toyotaCorolla;isoContainers;ImmersiveBlackouts;ImmersiveWaterShutoff;LifestyleHobbies;GuitarMusicAddon;Lifestyle Hobbies - Furniture Fix;PSR;ChuckleberryFinnAlertSystem;errorMagnifier;YouDriveISleep;Aegis Panel - Furniture Fix;FWOFitnessWorkoutOverhaul;FWOBenchPressTreadmill;ImmersiveSnow;AviationCore;UH-1BHelicopter;ViewpointController;Viewpoint;PZVoxelStudioViewpoint;ZombieBuddy"
            # Leaves ~2Gi of headroom under the pod's 16Gi memory limit for
            # JVM/OS overhead outside the heap.
            - name: MIN_MEMORY
              value: "8192m"
            - name: MAX_MEMORY
              value: "14336m"
            - name: STEAMVAC
              value: "true"
          volumeMounts:
            # The entrypoint script only mkdir's directories under the
            # image's built-in HOMEDIR (/home/steam/Zomboid) regardless of
            # CACHEDIR, so the persistent volume must be mounted there
            # directly rather than at a custom CACHEDIR path.
            - name: data
              mountPath: /home/steam/Zomboid
            # Persists downloaded Workshop mod content across pod restarts.
            # Without this, SteamCMD re-downloads the entire modlist from
            # Steam every time the pod is recreated (reboot, node drain,
            # image update, etc.) because this path lives outside the data
            # PVC above, on the container's ephemeral/writable layer.
            - name: workshop-data
              mountPath: /home/steam/pz-dedicated/steamapps/workshop
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              # Workshop content now persists on the workshop-data PVC
              # instead of the container's writable layer (see the
              # volumeMounts comment above), so ephemeral-storage no longer
              # needs to hold ~177 Workshop items (some 1GB+) on top of the
              # game install. This headroom now only covers the baked-in
              # game files, logs, and other scratch writes.
              ephemeral-storage: 4Gi
            limits:
              cpu: "6"
              memory: 16Gi
              ephemeral-storage: 8Gi
          # Startup can take several minutes (server install/update + world
          # load), so give it a generous startup window before liveness
          # checks kick in. The image has no `pgrep`/`ps`, so probe the RCON
          # TCP port instead — it only starts listening once the server has
          # fully initialized.
          startupProbe:
            tcpSocket:
              port: 27015
            periodSeconds: 10
            # 180 * 10s = 30 minutes. A heavily-modded server (e.g. the
            # migrated servertest save with 177 Workshop items) needs much
            # longer than the original 10-minute budget to download mods
            # via SteamCMD before RCON starts listening.
            failureThreshold: 180
          livenessProbe:
            tcpSocket:
              port: 27015
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zomboid-data
        - name: workshop-data
          persistentVolumeClaim:
            claimName: zomboid-workshop-data
