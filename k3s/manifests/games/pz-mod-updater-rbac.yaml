apiVersion: v1
kind: ServiceAccount
metadata:
  name: pz-mod-updater
  namespace: games
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pz-mod-updater
  namespace: games
rules:
  # Read the Zomboid Deployment's WORKSHOP_IDS and patch it to trigger a
  # rollout restart once an update is safe to apply.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["zomboid"]
    verbs: ["get", "patch"]
  # Persist last-seen mod versions. create is needed for the first-ever
  # run (ConfigMap doesn't exist yet); the resourceName restriction can't
  # apply to create, so it's scoped by name on get/update only.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["pz-mod-state"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pz-mod-updater
  namespace: games
subjects:
  - kind: ServiceAccount
    name: pz-mod-updater
    namespace: games
roleRef:
  kind: Role
  name: pz-mod-updater
  apiGroup: rbac.authorization.k8s.io
