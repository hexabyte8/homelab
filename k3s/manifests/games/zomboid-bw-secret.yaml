# BitwardenSecret — zomboid-credentials
# The sm-operator syncs this BWS secret into the `zomboid-credentials` k8s
# Secret. Only one key (ADMINPASSWORD) is synced from BWS — the sm-operator
# maps on bwSecretId internally, so mapping the same id to two key names
# doesn't produce two keys. The Deployment's RCONPASSWORD env var instead
# references this same ADMINPASSWORD key (same password used for both).
#
# BWS secret UUID used:
#   e8cf0572-b0cb-4564-91e1-b4d8001c8753  ZOMBOID_PASSWORD → ADMINPASSWORD
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: zomboid-credentials
  namespace: games
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: zomboid-credentials
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "e8cf0572-b0cb-4564-91e1-b4d8001c8753"
      secretKeyName: ADMINPASSWORD
