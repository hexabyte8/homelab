apiVersion: v1
kind: Service
metadata:
  name: zomboid
  namespace: games
  annotations:
    # No loadBalancerIPs override — MetalLB auto-assigns the next free IP
    # from its pool.
    svccontroller.k3s.cattle.io/nodeselectorsterm: "kubernetes.io/hostname in (none)"
spec:
  type: LoadBalancer
  selector:
    app: zomboid
  ports:
    # Build 42+ only needs the two game UDP ports (no more per-player TCP
    # client-slot range like older PZ builds required).
    - port: 16261
      targetPort: 16261
      protocol: UDP
      name: game-udp
    - port: 16262
      targetPort: 16262
      protocol: UDP
      name: game-udp2
    - port: 8766
      targetPort: 8766
      protocol: UDP
      name: steam1-udp
    - port: 8767
      targetPort: 8767
      protocol: UDP
      name: steam2-udp
---
# RCON is admin-only — keep it cluster-internal rather than exposing it via
# the public LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: zomboid-rcon
  namespace: games
spec:
  type: ClusterIP
  selector:
    app: zomboid
  ports:
    - port: 27015
      targetPort: 27015
      protocol: TCP
      name: rcon
