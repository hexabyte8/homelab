apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsmai
  namespace: dsmai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsmai
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dsmai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Upstream publishes no image; fetch the static site at a pinned commit.
        # Bump DSMAI_REF to update.
        - name: fetch-site
          image: alpine/git:2.47.2
          env:
            - name: DSMAI_REF
              value: 6638f162a8ef1f01919d29b62d2979e0ba0c450a
            - name: HOME
              value: /tmp
          command:
            - sh
            - -ec
            - |
              # The emptyDir root is owned by root, even with fsGroup set.
              git config --global --add safe.directory /site
              git init -q /site
              cd /site
              git fetch -q --depth 1 https://github.com/aravpanwar/dsmai "$DSMAI_REF"
              git checkout -q FETCH_HEAD
              rm -rf .git
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: site
              mountPath: /site
            - name: tmp
              mountPath: /tmp
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          emptyDir: {}
        - name: tmp
          emptyDir: {}
