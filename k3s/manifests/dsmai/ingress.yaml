apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsmai
  namespace: dsmai
  annotations:
    tailscale.com/proxy-class: "prod"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsmai
                port:
                  number: 8080
  tls:
    - hosts:
        - dsmai
