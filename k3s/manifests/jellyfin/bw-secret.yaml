# BitwardenSecret — transmission-openvpn-credentials
# The sm-operator syncs these BWS secrets into the
# `transmission-openvpn-credentials` k8s Secret.
#
# BWS secret UUIDs used:
#   1947c5ba-f6b7-4db6-8c9b-b43a0186a989  TRANSMISSION_OVPN         → vpn.ovpn
#   4e132d2b-cd68-4c7e-9f56-b43a0186ac21  TRANSMISSION_RPC_USERNAME → TRANSMISSION_RPC_USERNAME
#   ae81ed73-294c-4d5f-aa65-b43a0186aeb8  TRANSMISSION_RPC_PASSWORD → TRANSMISSION_RPC_PASSWORD
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: transmission-openvpn-credentials
  namespace: jellyfin
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: transmission-openvpn-credentials
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "1947c5ba-f6b7-4db6-8c9b-b43a0186a989"
      secretKeyName: vpn.ovpn
    - bwSecretId: "4e132d2b-cd68-4c7e-9f56-b43a0186ac21"
      secretKeyName: TRANSMISSION_RPC_USERNAME
    - bwSecretId: "ae81ed73-294c-4d5f-aa65-b43a0186aeb8"
      secretKeyName: TRANSMISSION_RPC_PASSWORD
