# BitwardenSecret — actual-mcp-secondary-secret
#
# Reuses the same server password and encryption password as the primary
# actual-mcp instance. Only the ACTUAL_BUDGET_SYNC_ID differs — it points
# to the secondary budget file.
#
# One-time setup — ensure the following entries exist in BWS:
#
#   ACTUAL_MCP_ACTUAL_PASSWORD                    (shared with primary)
#   ACTUAL_MCP_ACTUAL_BUDGET_ENCRYPTION_PASSWORD  (shared with primary)
#   ACTUAL_MCP_SECONDARY_BUDGET_SYNC_ID           value: (sync ID of the secondary budget)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: actual-mcp-secondary-secret
  namespace: actual-mcp-secondary
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: actual-mcp-secondary-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "de384476-671c-482f-bf07-b4a00173037b"
      secretKeyName: ACTUAL_PASSWORD
    - bwSecretId: "a538a7b4-31ce-4a61-b682-b4a100f7f43f"
      secretKeyName: ACTUAL_BUDGET_SYNC_ID
    - bwSecretId: "efeb7bce-bb16-4804-bfa7-b4a00173ac34"
      secretKeyName: ACTUAL_BUDGET_ENCRYPTION_PASSWORD
