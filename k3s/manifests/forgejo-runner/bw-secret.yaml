# BitwardenSecret — forgejo-runner-token
#
# One-time setup for the Forgejo Actions runner registration token:
#   1. In Forgejo, go to Admin > Actions > Runners > Create runner token:
#      https://git.chronobyte.net/admin/actions/runners
#   2. Store the generated token in Bitwarden Secrets Manager as a new secret
#      named FORGEJO_RUNNER_TOKEN (or similar).
#   3. Replace REPLACE_ME_FORGEJO_RUNNER_TOKEN_UUID below with the UUID of that
#      Bitwarden secret before merging.
#
# The sm-operator will sync the token into the `forgejo-runner-token` k8s Secret,
# which the runner init container uses to register itself on first boot.
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: forgejo-runner-token
  namespace: forgejo
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: forgejo-runner-token
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME_FORGEJO_RUNNER_TOKEN_UUID"
      secretKeyName: FORGEJO_RUNNER_TOKEN
