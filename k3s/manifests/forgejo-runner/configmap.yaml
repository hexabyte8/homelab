apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo
data:
  FORGEJO_INSTANCE_URL: "https://git.chronobyte.net"
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 3
      labels:
        - ubuntu-latest:docker://node:20-bookworm
        - ubuntu-22.04:docker://node:20-bookworm
      timeout: 3h
    cache:
      enabled: true
      dir: /data/cache
    container:
      network: bridge
      # Privileged so job containers can create user/mount namespaces —
      # needed by rootless build tools like podman/buildah (used by the
      # the-long-haul release workflow) to build OCI images without a
      # docker socket. Job containers are still ephemeral, single-use, and
      # only reachable by whoever can push workflow files to a repo this
      # runner is registered against.
      privileged: true
      valid_volumes:
        - /data/cache
    host:
      workdir_parent: /data/workspace
