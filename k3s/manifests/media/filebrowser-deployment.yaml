apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      automountServiceAccountToken: false
      # media-library is ReadWriteOnce — must be on the same node as
      # calibre-web, which is the pod that first claims the volume.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: calibre-web
              topologyKey: kubernetes.io/hostname
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:v2.31.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          args:
            - --database=/config/filebrowser.db
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /srv
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config
        - name: media
          persistentVolumeClaim:
            claimName: media-library
