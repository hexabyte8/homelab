apiVersion: v1
kind: LimitRange
metadata:
  name: media-defaults
  namespace: media
spec:
  limits:
    - type: Container
      # Default ephemeral-storage for any container that doesn't set its own.
      # Prevents crash-loop container layers from consuming unbounded disk.
      # Pods with explicit resources override these.
      default:
        ephemeral-storage: 512Mi
      defaultRequest:
        ephemeral-storage: 100Mi
