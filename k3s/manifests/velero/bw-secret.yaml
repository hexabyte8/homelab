# BitwardenSecret — velero-s3-credentials
#
# Velero uses AWS-compatible S3 for backup storage.
# The BWS secret stores the full AWS credentials file content under the key
# `cloud`, which Velero mounts at /credentials/cloud via existingSecret.
#
# The AWS OpenTofu apply creates a dedicated, least-privilege IAM access key
# and automatically writes this credentials file to BWS.
#
# BWS secret content (INI format):
#   [default]
#   aws_access_key_id=<KEY>
#   aws_secret_access_key=<SECRET>
#
# BWS secret UUIDs:
#   ef64b78c-a531-4910-9b89-b4b10013bbf1  cloud (AWS credentials file)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: velero-s3-credentials
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "ef64b78c-a531-4910-9b89-b4b10013bbf1"
      secretKeyName: cloud
