# BitwardenSecret — velero-s3-credentials
#
# Velero uses AWS-compatible S3 for backup storage.
#
# One-time setup — create the following entries in BWS (sm.bitwarden.com),
# then replace the placeholder UUIDs below with the real ones:
#
#   AWS_ACCESS_KEY_ID      value: (IAM key with S3 read/write to backup bucket)
#   AWS_SECRET_ACCESS_KEY  value: (IAM secret)
#
# BWS secret UUIDs:
#   REPLACE_ME  AWS_ACCESS_KEY_ID
#   REPLACE_ME  AWS_SECRET_ACCESS_KEY
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: velero-s3-credentials
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME"
      secretKeyName: aws_access_key_id
    - bwSecretId: "REPLACE_ME"
      secretKeyName: aws_secret_access_key
