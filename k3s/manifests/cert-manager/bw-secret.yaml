# BitwardenSecret — cloudflare-api-token (cert-manager)
# The sm-operator syncs this BWS secret into the `cloudflare-api-token`
# k8s Secret used by the cert-manager ClusterIssuer for DNS-01 challenges.
#
# BWS secret UUID used:
#   e46f58e9-d6d4-429f-8ce1-b40f00ca046c  CLOUDFLARE_API_TOKEN → api-token
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: cloudflare-api-token
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "e46f58e9-d6d4-429f-8ce1-b40f00ca046c"
      secretKeyName: api-token
