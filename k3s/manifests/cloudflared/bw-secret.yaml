# BitwardenSecret — cloudflared-tunnel-credentials
# The sm-operator syncs this BWS secret into the `cloudflared-tunnel-credentials`
# k8s Secret used by the cloudflared deployment.
#
# BWS secret UUID used:
#   3289b15b-f52c-45aa-8b9f-b41600f5e14f  CLOUDFLARE_TUNNEL_TOKEN → tunnel-token
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: cloudflared-tunnel-credentials
  namespace: cloudflared
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: cloudflared-tunnel-credentials
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "3289b15b-f52c-45aa-8b9f-b41600f5e14f"
      secretKeyName: tunnel-token
