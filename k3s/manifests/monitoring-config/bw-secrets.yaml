# BitwardenSecrets — Grafana (monitoring namespace)
#
# grafana-admin-secret  — Grafana admin credentials (admin login fallback)
# grafana-oauth-secret  — Authentik OIDC client credentials (primary auth)
#
# The OAuth secret values are generated by OpenTofu when it provisions the
# Authentik provider. The opentofu-reusable.yml workflow writes them to BWS
# via `bws secret edit` after each `tofu apply` so the operator picks them
# up automatically on the next sync cycle.
#
# BWS secret UUIDs:
#   c7464b75-8209-4b8b-ab11-b49b0174b7bf  GRAFANA_ADMIN_USER     → admin-user
#   c0f6acf5-ac9e-4f36-af05-b49b0174d685  GRAFANA_ADMIN_PASSWORD → admin-password
#   6298c6d7-3e70-465a-9d9c-b48e0176f8a3  GF_AUTH_GENERIC_OAUTH_CLIENT_ID
#   cfa6860a-116e-4893-9b23-b48e0176f8cd  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: grafana-admin-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "c7464b75-8209-4b8b-ab11-b49b0174b7bf"
      secretKeyName: admin-user
    - bwSecretId: "c0f6acf5-ac9e-4f36-af05-b49b0174d685"
      secretKeyName: admin-password
---
# BitwardenSecret — grafana-oauth-secret (monitoring namespace)
#
# The OAuth secret values are generated by OpenTofu when it provisions the
# Authentik provider. The opentofu-reusable.yml workflow writes them to BWS
# via `bws secret edit` after each `tofu apply` so the operator picks them
# up automatically on the next sync cycle.
#
# BWS secret UUIDs:
#   6298c6d7-3e70-465a-9d9c-b48e0176f8a3  GF_AUTH_GENERIC_OAUTH_CLIENT_ID
#   cfa6860a-116e-4893-9b23-b48e0176f8cd  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: grafana-oauth-secret
  namespace: monitoring
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: grafana-oauth-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "6298c6d7-3e70-465a-9d9c-b48e0176f8a3"
      secretKeyName: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
    - bwSecretId: "cfa6860a-116e-4893-9b23-b48e0176f8cd"
      secretKeyName: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
