# BitwardenSecret — alertmanager-ntfy-topics
#
# Optional: comma-separated list of ntfy topic names the alert relay publishes
# to (see k3s/manifests/monitoring/alertmanager-ntfy-relay.yaml). Sourcing the
# channel identifier from the secret manager keeps it out of the repository.
#
# One-time setup:
#   1. Create an entry in BWS (sm.bitwarden.com) named NTFY_TOPICS with a
#      comma-separated list of topics. Use an unguessable primary topic, e.g.:
#        openssl rand -hex 16
#      During migration keep the legacy topic alongside the new one so mobile
#      subscriptions keep receiving alerts, e.g.:
#        <legacy-topic>,<new-random-topic>
#   2. Replace the placeholder bwSecretId below with the new entry's UUID.
#   3. Update the mobile app subscription to the new topic, then remove the
#      legacy topic from the list.
#
# Until the entry exists the relay falls back to its built-in default, so
# alert delivery is never interrupted by this manifest.
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: alertmanager-ntfy-topics
  namespace: monitoring
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: alertmanager-ntfy-topics
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_WITH_BWS_SECRET_UUID"
      secretKeyName: topics