# BitwardenSecret — abcdesktop-jwt-keys
#
# abcdesktop requires three RSA key pairs used for JWT signing/payload.
# Generate them once with:
#
#   openssl genrsa -out payload_private.pem 1024
#   openssl rsa    -in  payload_private.pem -outform PEM -pubout \
#                  -out _payload_public_raw.pem
#   openssl rsa -pubin -in _payload_public_raw.pem \
#               -RSAPublicKey_out -out payload_public.pem
#
#   openssl genrsa -out signing_private.pem 1024
#   openssl rsa    -in  signing_private.pem -outform PEM -pubout \
#                  -out signing_public.pem
#
#   openssl genrsa -out user_signing_private.pem 1024
#   openssl rsa    -in  user_signing_private.pem -outform PEM -pubout \
#                  -out user_signing_public.pem
#
# Then store each PEM file content as a BWS secret and replace the
# placeholder UUIDs below.
#
# BWS secret UUIDs (replace REPLACE_ME with real UUIDs after creating in BWS):
#   REPLACE_ME  abcdesktop_jwt_desktop_payload_private_key.pem
#   REPLACE_ME  abcdesktop_jwt_desktop_payload_public_key.pem
#   REPLACE_ME  abcdesktop_jwt_desktop_signing_private_key.pem
#   REPLACE_ME  abcdesktop_jwt_desktop_signing_public_key.pem
#   REPLACE_ME  abcdesktop_jwt_user_signing_private_key.pem
#   REPLACE_ME  abcdesktop_jwt_user_signing_public_key.pem
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: abcdesktop-jwt-keys
  namespace: abcdesktop
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: abcdesktop-jwt-keys
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME"
      secretKeyName: abcdesktop_jwt_desktop_payload_private_key.pem
    - bwSecretId: "REPLACE_ME"
      secretKeyName: abcdesktop_jwt_desktop_payload_public_key.pem
    - bwSecretId: "REPLACE_ME"
      secretKeyName: abcdesktop_jwt_desktop_signing_private_key.pem
    - bwSecretId: "REPLACE_ME"
      secretKeyName: abcdesktop_jwt_desktop_signing_public_key.pem
    - bwSecretId: "REPLACE_ME"
      secretKeyName: abcdesktop_jwt_user_signing_private_key.pem
    - bwSecretId: "REPLACE_ME"
      secretKeyName: abcdesktop_jwt_user_signing_public_key.pem
---
# BitwardenSecret — abcdesktop-mongodb-secret
#
# MongoDB credentials used by pyos to connect to the bundled MongoDB instance.
# Generate secure passwords (e.g. openssl rand -base64 24) and store in BWS.
#
# BWS secret UUIDs (replace REPLACE_ME with real UUIDs after creating in BWS):
#   REPLACE_ME  MONGO_ROOT_PASSWORD
#   REPLACE_ME  MONGO_PASSWORD
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: abcdesktop-mongodb-secret
  namespace: abcdesktop
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: abcdesktop-mongodb-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "REPLACE_ME"
      secretKeyName: MONGO_ROOT_PASSWORD
    - bwSecretId: "REPLACE_ME"
      secretKeyName: MONGO_PASSWORD
