apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: actual
      annotations:
        # Reloader: restart pod when the OpenID secret or config is rotated
        secret.reloader.stakater.com/reload: "actual-openid-secret"
        configmap.reloader.stakater.com/reload: "actual-config"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: actual
          image: actualbudget/actual-server:25.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5006
          envFrom:
            - configMapRef:
                name: actual-config
            - secretRef:
                name: actual-openid-secret
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-data
