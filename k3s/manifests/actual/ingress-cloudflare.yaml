apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-cloudflare
  namespace: actual
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # cloudflare-https-scheme MUST come first: cloudflared connects over HTTP,
    # so without rewriting X-Forwarded-Proto Authentik builds http:// callback
    # URLs and the ForwardAuth round-trip fails.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      kube-system-cloudflare-https-scheme@kubernetescrd,authentik-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: actual.chronobyte.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 5006
  tls:
    - hosts:
        - actual.chronobyte.net
      secretName: actual-cloudflare-tls
