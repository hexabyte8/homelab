apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-cloudflare
  namespace: actual
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
    - host: actual.chronobyte.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 5006
  tls:
    - hosts:
        - actual.chronobyte.net
      secretName: actual-cloudflare-tls
