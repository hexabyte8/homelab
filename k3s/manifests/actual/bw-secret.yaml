# BitwardenSecret — actual-openid-secret
# The sm-operator syncs these BWS secrets into the `actual-openid-secret`
# k8s Secret, which the Actual Budget deployment reads as env vars for
# OpenID Connect authentication via Authentik.
#
# The ACTUAL_OPENID_CLIENT_SECRET is generated by OpenTofu when it provisions
# the Authentik OAuth2 provider. The opentofu-reusable.yml workflow writes
# it to BWS via `bws secret edit` after each `tofu apply`.
#
# One-time setup — create these 3 entries in BWS (sm.bitwarden.com), then
# replace the placeholder UUIDs below with the real ones:
#
#   ACTUAL_OPENID_DISCOVERY_URL   value: https://authentik.chronobyte.net/application/o/actual/
#   ACTUAL_OPENID_CLIENT_ID       value: actual
#   ACTUAL_OPENID_CLIENT_SECRET   value: (written by tofu CI after first apply)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: actual-openid-secret
  namespace: actual
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: actual-openid-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "54b148a3-ef41-4732-b483-b49b01737cee"
      secretKeyName: ACTUAL_OPENID_DISCOVERY_URL
    - bwSecretId: "b5410954-5339-4a93-9c78-b49b0173a58b"
      secretKeyName: ACTUAL_OPENID_CLIENT_ID
    - bwSecretId: "1f5eb6e8-6c44-4cec-9a9d-b49b0173d913"
      secretKeyName: ACTUAL_OPENID_CLIENT_SECRET
