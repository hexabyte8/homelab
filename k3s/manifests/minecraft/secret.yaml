# Placeholders — never commit real values.
# RCON_PASSWORD is patched by the k3s-patch-secrets workflow
# (target=minecraft-rcon-password).
# CF_API_KEY is a CurseForge API key (https://console.curseforge.com/) and must
# be patched manually, e.g.:
#   kubectl -n minecraft patch secret minecraft-secrets --type=merge \
#     -p '{"stringData":{"CF_API_KEY":"<key>"}}'
# Note: CurseForge keys start with `$2a$10$...`; set via stringData as-is (no
# shell expansion) to keep the `$` characters intact.
apiVersion: v1
kind: Secret
metadata:
  name: minecraft-secrets
  namespace: minecraft
type: Opaque
stringData:
  RCON_PASSWORD: REPLACE_ME
  CF_API_KEY: REPLACE_ME
