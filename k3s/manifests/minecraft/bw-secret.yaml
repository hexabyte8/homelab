# BitwardenSecret — minecraft-secrets
# The sm-operator syncs these BWS secrets into the `minecraft-secrets` k8s
# Secret, consumed by the Deployment via envFrom.
#
#   e2f18624-762c-4818-a929-b448013205f9  RCON_PASSWORD
#   8998252e-d431-40c7-8431-b4df011607eb  CF_API_KEY (CurseForge API key)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: minecraft-secrets
  namespace: minecraft
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: minecraft-secrets
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "e2f18624-762c-4818-a929-b448013205f9"
      secretKeyName: RCON_PASSWORD
    - bwSecretId: "8998252e-d431-40c7-8431-b4df011607eb"
      secretKeyName: CF_API_KEY
