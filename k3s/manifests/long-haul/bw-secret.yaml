# BitwardenSecret — long-haul-registry-source
#
# Syncs the Forgejo PAT (read:package scope, user hexabyte) used to pull the
# private the-long-haul container image. The sm-operator can only produce
# Opaque secrets, but kubelet's imagePullSecrets mechanism requires a secret
# of type kubernetes.io/dockerconfigjson — so this Opaque secret is not used
# directly as an imagePullSecret. Instead, registry-sync-cronjob.yaml reads
# it and materializes the properly-typed `long-haul-registry` secret that
# the Deployment actually references.
#
# BWS secret UUID used:
#   a977c8c4-67ad-4d3c-a028-b4c6017ba17b  FORGEJO_ACCESS_KEY → password
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: long-haul-registry-source
  namespace: long-haul
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: long-haul-registry-source
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "a977c8c4-67ad-4d3c-a028-b4c6017ba17b"
      secretKeyName: password
