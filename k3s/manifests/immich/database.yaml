apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14.24-1.1.1
  postgresql:
    shared_preload_libraries:
      - vchord.so
  bootstrap:
    initdb:
      database: immich
      owner: immich
      dataChecksums: true
      postInitApplicationSQL:
        - ALTER ROLE immich SUPERUSER
  managed:
    roles:
      - name: immich
        login: true
        superuser: true
  storage:
    size: 10Gi
    storageClass: longhorn
