# Manually-managed Endpoints pointing at the router's LAN admin UI
# (192.168.1.254:80 — see the Home Network Status page). Since the backend
# isn't a Kubernetes pod, there's no selector on the Service to generate this
# automatically.
apiVersion: v1
kind: Endpoints
metadata:
  name: router-admin
  namespace: router-admin
subsets:
  - addresses:
      - ip: 192.168.1.254
    ports:
      - name: http
        port: 80
