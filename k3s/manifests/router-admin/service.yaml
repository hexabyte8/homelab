# No selector: this Service has no pods behind it. It's a stable in-cluster
# name/port for the physical router's admin UI, which lives outside the
# cluster. See endpoints.yaml for the actual backend address.
apiVersion: v1
kind: Service
metadata:
  name: router-admin
  namespace: router-admin
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
