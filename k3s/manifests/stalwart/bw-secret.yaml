# BitwardenSecret — stalwart-secrets
# The sm-operator syncs these BWS secrets into the `stalwart-secrets` k8s Secret.
#
# BWS secret UUIDs used:
#   6e047103-0d0d-40ff-8255-b43a00e06e68  STALWART_ADMIN_PASSWORD → admin-password
#   4f8db3c6-416a-412d-9f6f-b4160169641f  STALWART_RESEND_API_KEY → resend-api-key
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: stalwart-secrets
  namespace: stalwart
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: stalwart-secrets
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "6e047103-0d0d-40ff-8255-b43a00e06e68"
      secretKeyName: admin-password
    - bwSecretId: "4f8db3c6-416a-412d-9f6f-b4160169641f"
      secretKeyName: resend-api-key
