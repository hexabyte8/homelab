# BitwardenSecret — actual-mcp-secret
#
# The sm-operator syncs these BWS secrets into the `actual-mcp-secret`
# k8s Secret, which the actual-mcp Deployment reads as env vars so it can
# talk to the in-cluster Actual Budget server.
#
# The MCP endpoint itself is tailnet-only (Tailscale Ingress via the
# k8s-operator, gated by the `tag:copilot -> tag:k8s-operator:443` ACL),
# so no bearer token is required — being on the tailnet is the credential,
# same pattern as `mcp-kubernetes`.
#
# One-time setup — create these entries in BWS (sm.bitwarden.com) under
# the same project used by the `actual` app, then replace the placeholder
# UUIDs below with the real ones:
#
#   ACTUAL_MCP_ACTUAL_PASSWORD                    value: (server password for the Actual instance)
#   ACTUAL_MCP_ACTUAL_BUDGET_SYNC_ID              value: (sync ID of the budget to expose)
#   ACTUAL_MCP_ACTUAL_BUDGET_ENCRYPTION_PASSWORD  value: (encryption password, if the budget is encrypted; else leave empty)
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: actual-mcp-secret
  namespace: actual-mcp
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"
  secretName: actual-mcp-secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "de384476-671c-482f-bf07-b4a00173037b"
      secretKeyName: ACTUAL_PASSWORD
    - bwSecretId: "51266372-e486-48d5-ac59-b4a0017398fd"
      secretKeyName: ACTUAL_BUDGET_SYNC_ID
    - bwSecretId: "efeb7bce-bb16-4804-bfa7-b4a00173ac34"
      secretKeyName: ACTUAL_BUDGET_ENCRYPTION_PASSWORD
