apiVersion: v1
kind: ConfigMap
metadata:
  name: actual-mcp-config
  namespace: actual-mcp
data:
  # The Actual Budget MCP server needs to reach an Actual Budget server.
  # Point it at the in-cluster `actual` Service so traffic stays on-cluster
  # rather than egressing through the Cloudflare Tunnel.
  ACTUAL_SERVER_URL: "http://actual.actual.svc.cluster.local:5006"
  # Local cache directory inside the container (mounted from the PVC).
  ACTUAL_DATA_DIR: "/data"
