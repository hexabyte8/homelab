# BitwardenSecret — authentik-credentials
# The sm-operator syncs these BWS secrets into the `authentik-credentials`
# k8s Secret on every refresh cycle (default: 5 minutes).
#
# Prerequisites (one-time setup):
#   1. In BWS, create/verify a Machine Account with access to these secrets.
#   2. Create an Access Token for it and store it in BWS as a new secret
#      (the k3s-patch-secrets workflow will create the bw-auth-token k8s Secret
#      in this namespace from that BWS entry).
#   3. Set BW_ORGANIZATION_ID as a GitHub Actions variable (Settings → Variables).
#
# BWS secret UUIDs used:
#   fad8a44d-352f-4fcc-b63b-b43a00e06027  AUTHENTIK_SECRET_KEY     → secret-key
#   7c78db78-67fb-447c-83ea-b43a00de1ecc  AUTHENTIK_BOOTSTRAP_PASSWORD → bootstrap-password
#   73e12b92-3483-4e71-a0ca-b43a00de4275  AUTHENTIK_BOOTSTRAP_EMAIL    → bootstrap-email
#   793deec1-de4b-487b-b685-b43a00e06099  AUTHENTIK_SMTP_PASSWORD      → smtp-password
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: authentik-credentials
  namespace: authentik
spec:
  organizationId: "5f82d531-e61f-4c86-963c-b40f00c51c93"  # BWS Settings → Organizations → copy UUID
  secretName: authentik-credentials
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  projectId: "aece2880-f0d0-4a77-9b0c-b40f00c78f1e"
  map:
    - bwSecretId: "fad8a44d-352f-4fcc-b63b-b43a00e06027"
      secretKeyName: secret-key
    - bwSecretId: "7c78db78-67fb-447c-83ea-b43a00de1ecc"
      secretKeyName: bootstrap-password
    - bwSecretId: "73e12b92-3483-4e71-a0ca-b43a00de4275"
      secretKeyName: bootstrap-email
    - bwSecretId: "793deec1-de4b-487b-b685-b43a00e06099"
      secretKeyName: smtp-password
