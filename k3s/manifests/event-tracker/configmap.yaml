# Sources are local community/news sites (J3 Media's Nashvegas.com and
# MtJuliet.com, and the Lebanon Wilson County Chamber of Commerce) that
# embed Schema.org Event JSON-LD server-side and allow crawling per
# robots.txt. See upstream README for config semantics (max_depth,
# max_pages_per_source, request_delay_seconds).
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-tracker-config
  namespace: event-tracker
data:
  config.json: |
    {
      "cities": [
        {
          "name": "Nashville",
          "sources": ["https://nashvegas.com/calendar-of-events/"]
        },
        {
          "name": "Lebanon",
          "sources": ["https://lebanonwilsonchamber.com/events/list/"]
        },
        {
          "name": "Mount Juliet",
          "sources": ["https://mtjuliet.com/calendar-of-events/"]
        }
      ],
      "max_pages_per_source": 25,
      "max_depth": 1,
      "request_delay_seconds": 1
    }
