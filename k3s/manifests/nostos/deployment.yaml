apiVersion: apps/v1
kind: Deployment
metadata:
  name: nostos
  namespace: nostos
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume (SQLite DB, books, backups, key ring)
  selector:
    matchLabels:
      app: nostos
  template:
    metadata:
      labels:
        app: nostos
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # APP_UID of the dotnet aspnet base image
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nostos
          # SelfHosted build of https://github.com/Christian-Gennari/Nostos.
          # Pinned to an immutable selfhosted-sha-* tag; bump to update.
          image: ghcr.io/christian-gennari/nostos:selfhosted-sha-303153a49c2ba82e45fcbee37e4488131d8f9bc3@sha256:161007dbc2cc610593e9d5d7a704098b2cac75fa9ded6a2b334581c7edbd0b25
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # nostos.db, books, backups and the Data Protection key ring (keys/)
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nostos-data
