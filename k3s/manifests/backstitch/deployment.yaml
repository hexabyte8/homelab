apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstitch
  namespace: backstitch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstitch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: backstitch
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstitch-sync-server
          image: ghcr.io/inkandswitch/backstitch-sync-server:latest
          imagePullPolicy: Always
          args:
            - "--data-dir"
            - "/data"
            - "--port"
            - "3000"
          env:
            - name: AUTH
              value: "oidc"
            - name: OIDC_ISSUER
              value: "https://authentik.chronobyte.net/application/o/backstitch/"
            - name: OIDC_CLIENT_ID
              value: "backstitch"
            - name: OIDC_REDIRECT_PORT
              value: "58656"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backstitch-data
