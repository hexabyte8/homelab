---
# Stakater Reloader
# Watches k8s Secrets (and ConfigMaps) and automatically restarts Deployments/
# StatefulSets that reference them when their contents change.
# This enables fully-automated secret rotation: BWS → sm-operator → k8s Secret
# change → Reloader detects change → pod restart → app picks up new secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  releaseName: reloader
  targetNamespace: reloader
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: reloader
      version: "2.2.14"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 12h
  values:
    reloader:
      deployment:
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      # Watch all namespaces. Reloader is annotation-gated by design — only
      # workloads carrying `secret./configmap.reloader.stakater.com/reload`
      # (or an `auto` annotation) are ever restarted — so a global watch does
      # not cause spurious rollouts.
      #
      # NOTE: watchGlobally=false restricts Reloader to its *own* namespace
      # only (namespaced Role, no ClusterRole); it does not mean "only
      # annotated resources". The `namespaceSelector` value is ignored in that
      # mode, and even when global it expects k8s label selectors — not
      # namespace names — so a namespace list there silently matches nothing.
      # With the previous config, secret rotations in app namespaces never
      # triggered the intended pod restarts.
      watchGlobally: true
      logFormat: json
