---
# Stakater Reloader
# Watches k8s Secrets (and ConfigMaps) and automatically restarts Deployments/
# StatefulSets that reference them when their contents change.
# This enables fully-automated secret rotation: BWS → sm-operator → k8s Secret
# change → Reloader detects change → pod restart → app picks up new secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  releaseName: reloader
  targetNamespace: reloader
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: reloader
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 12h
  values:
    reloader:
      watchGlobally: false   # only watch annotated resources
      logFormat: json
