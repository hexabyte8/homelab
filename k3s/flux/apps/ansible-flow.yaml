# Ansible Flow — web-based Ansible workflow builder
# (https://github.com/hexabyte8/ansible-flow). Tailnet-only via Tailscale Ingress.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ansible-flow
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/ansible-flow
  targetNamespace: ansible-flow
