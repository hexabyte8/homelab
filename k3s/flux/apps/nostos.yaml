# Nostos — self-hosted reading / notes / writing app
# (https://github.com/Christian-Gennari/Nostos). Tailnet-only via Tailscale Ingress.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nostos
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/nostos
  targetNamespace: nostos
