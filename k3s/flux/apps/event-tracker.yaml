---
# event-tracker — self-hosted crawler/web UI for local event listings.
# Accessible only over the tailnet (no public/Cloudflare ingress).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: event-tracker
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/event-tracker
  targetNamespace: event-tracker
