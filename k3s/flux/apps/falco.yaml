---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: flux-system
spec:
  interval: 30m
  releaseName: falco
  targetNamespace: falco
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: falco
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  values:
    # modern_ebpf requires no kernel headers — best choice for k3s nodes
    driver:
      kind: modern_ebpf
      modernEbpf:
        # Required to allow allowPrivilegeEscalation: false — switches from
        # privileged: true to explicit capability grants (BPF, SYS_RESOURCE,
        # PERFMON, SYS_PTRACE). Without this, the chart auto-generates
        # privileged: true which conflicts with allowPrivilegeEscalation: false.
        leastPrivileged: true

    # Set allowPrivilegeEscalation: false. leastPrivileged: true above is
    # required — it replaces privileged: true with explicit capabilities.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - BPF
          - SYS_RESOURCE
          - PERFMON
          - SYS_PTRACE
        drop:
          - ALL

    falcoctl:
      artifact:
        install:
          securityContext:
            allowPrivilegeEscalation: false
        follow:
          securityContext:
            allowPrivilegeEscalation: false

    # k8s-metacollector sub-chart — passes values through to the sub-chart
    k8s-metacollector:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

    # Structured JSON output for easier ingestion by log tools
    falco:
      jsonOutput: true
      jsonIncludeOutputProperty: true
      logLevel: info
      # Increase priority threshold to reduce noise in a homelab
      priority: WARNING

      # Custom rules to suppress known-noisy alerts from abcdesktop user pods.
      # abcdesktop runs graphical application containers (X11, PulseAudio) that
      # legitimately spawn shells and write to /tmp by design.
      customRules:
        abcdesktop_rules.yaml: |-
          - macro: abcdesktop_pod
            condition: k8s.ns.name = "abcdesktop"

          # Suppress "shell spawned in a container" for the abcdesktop namespace.
          # abcdesktop intentionally runs interactive shells inside user desktop pods.
          - rule: Terminal shell in container
            desc: >
              Overrides the default rule — abcdesktop intentionally runs
              interactive shells inside user desktop pods.
            condition: >
              evt.type = execve and evt.dir = < and
              container and
              shell_procs and
              not abcdesktop_pod
            output: >
              A shell was spawned in a container with an attached terminal
              (user=%user.name %container.info shell=%proc.name parent=%proc.pname
              cmdline=%proc.cmdline pid=%proc.pid terminal=%proc.tty
              container_id=%container.id image=%container.image.repository)
            priority: NOTICE
            tags: [container, shell, mitre_execution]

    # Enrich events with Kubernetes pod/namespace/deployment metadata
    collectors:
      enabled: true
      kubernetes:
        enabled: true

    # Falcosidekick disabled by default; enable later to route alerts to ntfy/Slack
    falcosidekick:
      enabled: false

    # Expose Prometheus metrics so kube-prometheus-stack can scrape Falco
    metrics:
      enabled: true
      interval: 15s

    serviceMonitor:
      create: true
      labels:
        release: monitoring

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
