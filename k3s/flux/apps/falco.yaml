---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: flux-system
spec:
  interval: 30m
  releaseName: falco
  targetNamespace: falco
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: falco
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  values:
    # modern_ebpf requires no kernel headers — best choice for k3s nodes
    driver:
      kind: modern_ebpf
      modernEbpf:
        # Required to allow allowPrivilegeEscalation: false — switches from
        # privileged: true to explicit capability grants (BPF, SYS_RESOURCE,
        # PERFMON, SYS_PTRACE). Without this, the chart auto-generates
        # privileged: true which conflicts with allowPrivilegeEscalation: false.
        leastPrivileged: true

    # Set allowPrivilegeEscalation: false. leastPrivileged: true above is
    # required — it replaces privileged: true with explicit capabilities.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - BPF
          - SYS_RESOURCE
          - PERFMON
          - SYS_PTRACE
        drop:
          - ALL

    falcoctl:
      artifact:
        install:
          securityContext:
            allowPrivilegeEscalation: false
        follow:
          securityContext:
            allowPrivilegeEscalation: false

    # k8s-metacollector sub-chart — passes values through to the sub-chart
    k8s-metacollector:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

    # Structured JSON output for easier ingestion by log tools
    falco:
      json_output: true
      json_include_output_property: true
      log_level: info
      # Increase priority threshold to reduce noise in a homelab
      priority: WARNING

    # Enrich events with Kubernetes pod/namespace/deployment metadata
    collectors:
      enabled: true
      kubernetes:
        enabled: true

    # Falcosidekick forwards events to Alertmanager, which routes component=falco
    # alerts to ntfy via alertmanager-ntfy-relay (see monitoring.yaml).
    falcosidekick:
      enabled: true
      replicaCount: 1
      config:
        alertmanager:
          hostport: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
          minimumpriority: warning
          extralabels: "component:falco"

    # Silence known-benign noise seen in the logs: opencode's own git/gh/curl
    # (installed at container start) and systemd's PAM reads on the host.
    customRules:
      homelab-overrides.yaml: |-
        - rule: Drop and execute new binary in container
          condition: and not k8smeta.ns.name in (opencode, opencodew)
          override:
            condition: append
        - rule: Read sensitive file untrusted
          condition: and not proc.exepath = /usr/lib/systemd/systemd-executor
          override:
            condition: append

    # Expose Prometheus metrics so kube-prometheus-stack can scrape Falco
    metrics:
      enabled: true
      interval: 15s

    serviceMonitor:
      create: true
      labels:
        release: monitoring

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
