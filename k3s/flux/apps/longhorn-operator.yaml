---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: longhorn-operator
  targetNamespace: longhorn-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: 1.7.2
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      # Do not replace local-path as the default StorageClass.
      # Switch this to true once existing PVCs are migrated.
      defaultClass: false
      # Single Longhorn-capable node (k3s-agent-1 only) post k3s-agent-2
      # removal: a replica count >1 can never be satisfied since there's
      # nowhere to place a second copy, leaving every volume perpetually
      # "degraded". Reduced to 1 accordingly (single point of failure for
      # cluster storage, accepted tradeoff of the single-worker topology).
      defaultClassReplicaCount: 1
      defaultFsType: ext4
    defaultSettings:
      defaultReplicaCount: 1
      defaultDataPath: /var/lib/longhorn/
    csi:
      # k3s stores kubelet state under this path (not the default /var/lib/kubelet)
      kubeletRootDir: /var/lib/rancher/k3s/agent/kubelet
    ingress:
      enabled: false
    preUpgradeChecker:
      jobEnabled: false
