---
# Velero — cluster-level backup and restore for manifests and volumes.
# Uses AWS S3 (or compatible) as the backup storage location.
# Credentials injected from velero-s3-credentials Secret (synced via BWS).
#
# The bucket and dedicated IAM credentials are managed by opentofu/aws. After
# the AWS stack applies, CI writes the generated credentials file to BWS and
# the sm-operator syncs it into the velero-s3-credentials Secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 30m
  releaseName: velero
  targetNamespace: velero
  dependsOn:
    - name: velero-config
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: velero
      version: "9.x"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  values:
    # ── Credentials ──────────────────────────────────────────────────────────
    # velero-s3-credentials Secret is synced by the sm-operator from BWS.
    # The Velero chart mounts it as a file at /credentials/cloud.
    credentials:
      useSecret: true
      existingSecret: velero-s3-credentials
      secretContents: {}

    # ── Backup Storage Location ───────────────────────────────────────────────
    configuration:
      # Longhorn is not an AWS block-volume provider, so back up mounted PVC
      # contents through the Velero node agent rather than EC2 snapshots.
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: homelab-gameserver-backups-amp-velero
          default: true
          config:
            region: us-east-1

    # ── Init containers (plugin download) ────────────────────────────────────
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.12.0
        volumeMounts:
          - mountPath: /target
            name: plugins

    # ── Schedules ─────────────────────────────────────────────────────────────
    schedules:
      daily-full:
        disabled: false
        schedule: "0 2 * * *"
        template:
          ttl: 720h   # 30 days retention
          includedNamespaces:
            - "*"
          excludedNamespaces:
            - velero
          storageLocation: default
          snapshotVolumes: false
          defaultVolumesToFsBackup: true

    # ── Resources ─────────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # ── Node agent (for volume backups via restic/kopia) ─────────────────────
    nodeAgent:
      enabled: true
      podVolumePath: /var/lib/kubelet/pods
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
