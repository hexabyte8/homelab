---
# Velero — cluster-level backup and restore for manifests and volumes.
# Uses AWS S3 (or compatible) as the backup storage location.
# Credentials injected from velero-s3-credentials Secret (synced via BWS).
#
# The bucket and dedicated IAM credentials are managed by opentofu/aws. After
# the AWS stack applies, CI writes the generated credentials file to BWS and
# the sm-operator syncs it into the velero-s3-credentials Secret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 30m
  releaseName: velero
  targetNamespace: velero
  # velero-config is a Kustomization, not a HelmRelease — HelmRelease
  # dependsOn only supports HelmRelease-kind dependencies, so referencing it
  # here silently fails forever ("dependency ... not found") and blocks this
  # HelmRelease from ever installing. Remediation.retries below handles
  # transient CRD/secret readiness instead (same pattern as longhorn-config).
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: velero
      version: "9.x"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  values:
    # ── kubectl image (used by CRD upgrade/cleanup hook jobs) ─────────────────
    # Chart default (docker.io/bitnami/kubectl) 404s: Bitnami moved its free
    # images to bitnamilegacy in Aug 2025 and dropped versioned tags like
    # ":1.34" from docker.io/bitnami. registry.k8s.io/kubectl and
    # rancher/kubectl were both tried next, but both ship only a static
    # kubectl binary with no shell (~18MB images), and this hook job's
    # entrypoint is a shell script — pods crash with "stat /bin/sh: no such
    # file or directory" regardless of tag. bitnamilegacy/kubectl is
    # Bitnami's frozen (unmaintained, no new patches) mirror of the old
    # full debian-based image that does ship a shell. It stops at 1.33.4
    # (no 1.34 build), but minor version skew is fine for a one-shot
    # `kubectl apply` of CRDs. Tag is pinned explicitly since the chart's
    # auto-tag-from-cluster-version logic renders a bare "1.34" that
    # doesn't exist here anyway.
    kubectl:
      image:
        repository: bitnamilegacy/kubectl
        tag: 1.33.4-debian-12-r0

    # ── Credentials ──────────────────────────────────────────────────────────
    # velero-s3-credentials Secret is synced by the sm-operator from BWS.
    # The Velero chart mounts it as a file at /credentials/cloud.
    credentials:
      useSecret: true
      existingSecret: velero-s3-credentials
      secretContents: {}

    # ── Backup Storage Location ───────────────────────────────────────────────
    configuration:
      # Longhorn is not an AWS block-volume provider, so back up mounted PVC
      # contents through the Velero node agent rather than EC2 snapshots.
      defaultVolumesToFsBackup: true
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: homelab-gameserver-backups-amp-velero
          default: true
          config:
            region: us-east-1
      # The chart's default volumeSnapshotLocation value is a one-item list
      # with every field unset (name/provider/credential all null), which
      # still gets rendered into a real VolumeSnapshotLocation object unless
      # explicitly overridden — causing a hard schema-validation failure
      # ("spec.provider: Invalid value: null"). We don't use native volume
      # snapshots here (Longhorn isn't an AWS block-snapshot provider; PVC
      # contents are backed up via the node agent's fs-backup instead), so
      # disable it outright.
      volumeSnapshotLocation: []

    # ── Init containers (plugin download) ────────────────────────────────────
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.12.0
        volumeMounts:
          - mountPath: /target
            name: plugins

    # ── Schedules ─────────────────────────────────────────────────────────────
    schedules:
      daily-full:
        disabled: false
        schedule: "0 2 * * *"
        template:
          ttl: 720h   # 30 days retention
          includedNamespaces:
            - "*"
          excludedNamespaces:
            - velero
          storageLocation: default
          snapshotVolumes: false
          defaultVolumesToFsBackup: true

    # ── Resources ─────────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # ── Node agent (for volume backups via restic/kopia) ─────────────────────
    nodeAgent:
      enabled: true
      podVolumePath: /var/lib/kubelet/pods
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
