---
# The Helm chart's serviceMonitor.enabled flag doesn't render a Service or ServiceMonitor,
# so we manage those explicitly in k3s/manifests/caretta/ via this Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: caretta-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/caretta
  dependsOn:
    - name: caretta
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: caretta
  namespace: flux-system
spec:
  interval: 30m
  releaseName: caretta
  targetNamespace: caretta
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: caretta
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: groundcover
        namespace: flux-system
  values:
    # Tolerate all nodes (including control-plane) so the eBPF DaemonSet
    # captures traffic across the entire cluster.
    tolerations:
      - operator: "Exists"

    # Disable bundled storage/visualisation — the cluster already has
    # kube-prometheus-stack and Grafana; expose metrics via ServiceMonitor.
    grafana:
      enabled: false
    victoria-metrics-single:
      enabled: false

    # Expose Prometheus metrics for kube-prometheus-stack to scrape.
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
