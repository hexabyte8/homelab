---
# Applies the Grafana BitwardenSecret resources into the monitoring namespace.
# The sm-operator syncs BWS secrets into k8s Secrets automatically.
# See k3s/manifests/monitoring-config/bw-secrets.yaml for UUID mappings.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/monitoring-config
  targetNamespace: monitoring
