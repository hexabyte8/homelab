---
# diagrams.net (drawio) — self-hosted diagram editor.
# Stateless SPA; diagrams are stored client-side or exported to the user's
# own storage. Protected by Authentik ForwardAuth on the public hostname.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drawio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/drawio
  targetNamespace: drawio
