---
# Velero namespace + BWS secret sync — applied before the Velero HelmRelease
# so that the velero-s3-credentials Secret is available when Velero starts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/manifests/velero
  targetNamespace: velero
